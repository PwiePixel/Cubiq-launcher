<!-- Ladebildschirm, bis die Oberfläche bereit ist (auch nach einem Update-Neustart).
     Sprachneutral: Hier ist noch keine Übersetzung geladen, also nur Logo und Markenname.
     Halloween: der Merker `cubiq-event` steht, wenn das Event beim letzten Lauf aktiv war. -->
<script>
  try {
    if (localStorage.getItem('cubiq-event') === 'halloween') document.documentElement.dataset.event = 'halloween'
  } catch (e) {}
</script>
<div class="cubiq-splash" role="status" aria-busy="true" aria-label="Cubiq Launcher">
  <img src="/logo.png" alt="" width="96" height="96" />
  <div class="cubiq-splash-name">Cubiq <span>Launcher</span></div>
  <div class="cubiq-splash-bar"><span></span></div>
</div>
<style>
  html, body { margin: 0; height: 100%; background: #0c100e; }
  .cubiq-splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: radial-gradient(circle at 50% 46%, rgba(113, 163, 48, 0.16) 0%, rgba(113, 163, 48, 0) 38%), #0c100e;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #eef4ef;
  }
  .cubiq-splash img { filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.45)); }
  .cubiq-splash-name { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .cubiq-splash-name span { color: #a9d46b; }
  .cubiq-splash-bar { position: relative; width: 140px; height: 3px; border-radius: 999px; background: #1d2520; overflow: hidden; }
  .cubiq-splash-bar span {
    position: absolute; inset: 0; width: 40%; border-radius: 999px;
    background: linear-gradient(90deg, transparent, #71a330, #a9d46b, transparent);
    animation: cubiq-load 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  /* Halloween: Nacht und Mondsilber. */
  html[data-event="halloween"], html[data-event="halloween"] body { background: #07060c; }
  html[data-event="halloween"] .cubiq-splash {
    background: radial-gradient(circle at 50% 46%, rgba(142, 108, 201, 0.2) 0%, rgba(142, 108, 201, 0) 38%), #07060c;
    color: #ece9f5;
  }
  html[data-event="halloween"] .cubiq-splash-name span { color: #b9a2ea; }
  html[data-event="halloween"] .cubiq-splash-bar span { background: linear-gradient(90deg, transparent, #8e6cc9, #cfd5e3, transparent); }
  @keyframes cubiq-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .cubiq-splash-bar span { animation: none; width: 100%; } }
</style>
