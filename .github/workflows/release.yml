name: Release

# Baut bei jedem Versions-Tag (v1.2.3) den Windows-Installer und die Linux-Pakete (AppImage, .deb, .rpm), legt das
# GitHub-Release an (Titel und Beschreibung aus CHANGELOG.md) und aktualisiert den Update-Kanal, den der eingebaute
# Auto-Updater abfragt. Gestartet wird es meist von auto-release.yml (setzt Tag + Changelog), sonst per Tag-Push.
#
# Ablauf und Bericht (scripts/release-report.mjs):
# - „prepare“ prüft CHANGELOG.md und den Signaturschlüssel (scripts/check-signing.mjs) und legt sofort einen
#   Release-Entwurf „wird gebaut“ an – auf der Release-Seite sieht man gleich, dass etwas passiert.
# - Ist der Signaturschlüssel falsch oder fehlt er, wird trotzdem gebaut – nur ohne Update-Signatur (dann kein
#   latest.json, kein Auto-Update); der Grund steht in der Zusammenfassung des Laufs.
# - „publish“ veröffentlicht das Release, sobald der Windows-Installer da ist. Fehlt er, bleibt es ein Entwurf (nur
#   für Maintainer sichtbar) mit dem Grund ganz oben und einem Link zum Log; der Lauf endet dann rot.
# - `latest.json` entsteht nur, wenn Windows UND Linux signiert gebaut sind.
# Dazu die mobile App: signierte Android-APK und unsigniertes iOS-IPA im Kanal `mobile` (mobile.json + AltStore-Quelle).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandenes Tag, z. B. v0.1.0"
        required: true

# Nur „prepare“ (Entwurf) und „publish“ dürfen schreiben.
permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  # Vorab prüfen, was den Release sonst erst nach dem langen Build kippen würde, und den Entwurf anlegen.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changelog: ${{ steps.changelog.outputs.status }}
      changelog-reason: ${{ steps.changelog.outputs.reason }}
      signing: ${{ steps.signing.outputs.status }}
      signing-reason: ${{ steps.signing.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Nur die Tauri-CLI (Probe-Signatur) – ohne Nuxt-Vorbereitung.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: CHANGELOG.md for this version
        id: changelog
        run: |
          if node --experimental-strip-types scripts/changelog.mjs check "${TAG#v}" 2> "$RUNNER_TEMP/changelog.txt"; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/changelog.txt"
            echo "::error title=CHANGELOG.md::$(head -1 "$RUNNER_TEMP/changelog.txt")"
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "reason=$(tr '\n' ' ' < "$RUNNER_TEMP/changelog.txt" | cut -c1-500)" >> "$GITHUB_OUTPUT"
          fi

      - name: Update signature
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/check-signing.mjs

      # Was in diesem Build an ist – ohne Werte, nur ob gesetzt.
      - name: Settings overview
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CUBIQ_MSA_CLIENT_ID: ${{ vars.CUBIQ_MSA_CLIENT_ID }}
          CUBIQ_API_BASE: ${{ vars.CUBIQ_API_BASE }}
          CUBIQ_DISCORD_APP_ID: ${{ vars.CUBIQ_DISCORD_APP_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING: ${{ steps.signing.outputs.status }}
          SIGNING_REASON: ${{ steps.signing.outputs.reason }}
        run: |
          set_or_not() { if [ -n "$2" ]; then echo "| $1 | ✅ gesetzt |"; else echo "| $1 | ⚪ nicht gesetzt – $3 |"; fi; }
          {
            echo "### Einstellungen für $TAG"
            echo
            echo "| | |"
            echo "|---|---|"
            if [ "$SIGNING" = "ok" ]; then echo "| Update-Signatur (TAURI_SIGNING_PRIVATE_KEY + _PASSWORD) | ✅ $SIGNING_REASON |"
            else echo "| Update-Signatur (TAURI_SIGNING_PRIVATE_KEY + _PASSWORD) | ⚠️ $SIGNING_REASON Gebaut wird ohne Update-Signatur. |"; fi
            set_or_not "Secret CURSEFORGE_API_KEY" "$CURSEFORGE_API_KEY" "nur Modrinth"
            set_or_not "Variable CUBIQ_MSA_CLIENT_ID" "$CUBIQ_MSA_CLIENT_ID" "keine Microsoft-Anmeldung"
            set_or_not "Variable CUBIQ_API_BASE" "$CUBIQ_API_BASE" "Cubiq-Dienste aus"
            set_or_not "Variable CUBIQ_DISCORD_APP_ID" "$CUBIQ_DISCORD_APP_ID" "kein Discord-Status"
            set_or_not "Secret ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_BASE64" "Android-APK wird nicht veröffentlicht"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Draft release „building“
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-report.mjs start

  build:
    name: Windows
    needs: [prepare]
    if: needs.prepare.outputs.changelog == 'ok'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # Der Text landet im Release und im Auto-Update (geprüft schon in „prepare“).
      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        run: node --experimental-strip-types scripts/changelog.mjs notes "${TAG#v}" > release-notes.md

      # Schlüssel prüfen und bereinigt für den Build bereitstellen; ist er unbrauchbar, wird ohne Signatur gebaut.
      - name: Update signature
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/check-signing.mjs --export

      # Nur bauen und signieren – veröffentlicht wird im Job „publish“. Das Log geht in den Release-Bericht.
      - name: Build installer
        id: tauri
        shell: bash
        env:
          SIGNING: ${{ steps.signing.outputs.status }}
          # Ohne Secret bleibt CurseForge im Build ausgeschaltet (siehe crates/core/build.rs).
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          # Eigene, öffentliche Kennungen als Repo-Variablen (Settings → Secrets and variables →
          # Actions → Variables). Fehlt eine, bleibt die Funktion in diesem Build aus:
          # Microsoft-Anmeldung (Azure-App, von Mojang freigegeben), Cubiq-Dienste (eigener Server)
          # und Discord-Status (App-ID der Discord-App, siehe crates/core/src/discord/mod.rs).
          CUBIQ_MSA_CLIENT_ID: ${{ vars.CUBIQ_MSA_CLIENT_ID }}
          CUBIQ_API_BASE: ${{ vars.CUBIQ_API_BASE }}
          CUBIQ_DISCORD_APP_ID: ${{ vars.CUBIQ_DISCORD_APP_ID }}
        run: |
          set -o pipefail
          if [ "$SIGNING" = "ok" ]; then
            pnpm tauri build 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"
          else
            pnpm tauri build --config src-tauri/tauri.unsigned.conf.json 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"
          fi

      - name: Collect release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          src=$(ls src-tauri/target/release/bundle/nsis/*_x64-setup.exe | head -1)
          mkdir -p out
          exe="Cubiq-Launcher_${version}_x64-setup.exe"
          cp "$src" "out/$exe"
          cp release-notes.md out/
          # Eintrag für latest.json – zusammengeführt wird im Job „publish“. Nur mit Update-Signatur.
          if [ -f "$src.sig" ]; then
            cp "$src.sig" "out/$exe.sig"
            node scripts/updater-manifest.mjs platform windows-x86_64 "out/$exe" > out/platform-windows.json
          fi
          ls -la out

      # Portable Version: EXE + mitgelieferte Ressourcen (Cubiq Client in client-mod/, liegen wie beim Installer
      # neben der EXE) + Marker portable.txt + kurzes README. Die Daten landen dann in data/ daneben.
      # Kein Eintrag in latest.json – die portable Version aktualisiert sich nicht selbst.
      - name: Portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG.TrimStart('v')
          $release = 'src-tauri/target/release'
          $exe = @("$release/Cubiq Launcher.exe", "$release/cubiq-launcher.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $exe) { throw 'Launcher-EXE not found in target/release' }
          $stage = 'portable'
          New-Item -ItemType Directory -Force "$stage/client-mod" | Out-Null
          Copy-Item -LiteralPath $exe "$stage/Cubiq Launcher.exe"
          Copy-Item -Recurse -Force 'src-tauri/resources/client-mod/*' "$stage/client-mod/"
          Set-Content -Encoding utf8 "$stage/portable.txt" "This file switches the Cubiq Launcher to portable mode. Data is stored in the 'data' folder next to it."
          $readme = @(
            "Cubiq Launcher $version - portable",
            "",
            "Unzip this folder anywhere (e.g. a USB stick) and start 'Cubiq Launcher.exe'.",
            "All data (instances, Java, accounts, settings) is stored in the 'data' folder next to it.",
            "Needs the Microsoft Edge WebView2 Runtime (built into Windows 10/11).",
            "",
            "Updates: the portable version doesn't update itself. Download the new ZIP from",
            "https://github.com/PwiePixel/Cubiq-launcher/releases and replace the files - keep the 'data' folder.",
            "Delete portable.txt to use the normal data folder in %APPDATA% instead.",
            "",
            "---",
            "",
            "Cubiq Launcher $version - portabel",
            "",
            "Den Ordner irgendwohin entpacken (z. B. auf einen USB-Stick) und 'Cubiq Launcher.exe' starten.",
            "Alle Daten (Instanzen, Java, Konten, Einstellungen) liegen im Ordner 'data' daneben.",
            "Braucht die Microsoft Edge WebView2 Runtime (in Windows 10/11 enthalten).",
            "",
            "Updates: Die portable Version aktualisiert sich nicht selbst. Neue ZIP von",
            "https://github.com/PwiePixel/Cubiq-launcher/releases laden und die Dateien ersetzen - den Ordner 'data' behalten.",
            "Ohne portable.txt nutzt der Launcher wieder den normalen Datenordner in %APPDATA%."
          )
          Set-Content -Encoding utf8 "$stage/README.txt" $readme
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = "out/Cubiq-Launcher_${version}_x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal
          Get-Item $zip | Format-List Name, Length

      # Immer: was gebaut wurde und warum nicht – liest „publish“ für den Bericht.
      - name: Status
        if: always()
        shell: bash
        env:
          STEP_NOTES: ${{ steps.notes.outcome }}
          STEP_BUILD: ${{ steps.tauri.outcome }}
          STEP_COLLECT: ${{ steps.collect.outcome }}
          SIGNING: ${{ steps.signing.outputs.status }}
          BUILD_LOG: ${{ runner.temp }}/tauri-build.log
        run: node scripts/release-report.mjs job windows

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: out/
          if-no-files-found: warn

  linux:
    name: Linux
    needs: [prepare]
    if: needs.prepare.outputs.changelog == 'ok'
    # Ältestes unterstütztes Ubuntu-LTS: das glibc hier ist die Untergrenze für
    # AppImage, .deb und .rpm (neuere Distributionen laufen damit alle).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: System libraries (WebKitGTK 4.1, GTK 3)
        # Mit Zeitgrenze und Wiederholung – ein hängender Paket-Spiegel soll den Release-Build nicht blockieren.
        timeout-minutes: 25
        run: |
          bash scripts/apt-install.sh desktop-file-utils libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev patchelf file

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-linux
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - name: Release notes from CHANGELOG.md
        id: notes
        run: node --experimental-strip-types scripts/changelog.mjs notes "${TAG#v}" > /dev/null

      - name: Update signature
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/check-signing.mjs --export

      - name: Build AppImage, .deb and .rpm
        id: tauri
        env:
          SIGNING: ${{ steps.signing.outputs.status }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CUBIQ_MSA_CLIENT_ID: ${{ vars.CUBIQ_MSA_CLIENT_ID }}
          CUBIQ_API_BASE: ${{ vars.CUBIQ_API_BASE }}
          CUBIQ_DISCORD_APP_ID: ${{ vars.CUBIQ_DISCORD_APP_ID }}
          # linuxdeploy ist selbst ein AppImage – ohne FUSE im Runner entpacken statt einhängen.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: |
          set -o pipefail
          if [ "$SIGNING" = "ok" ]; then
            pnpm tauri build --bundles appimage,deb,rpm 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"
          else
            pnpm tauri build --bundles appimage,deb,rpm --config src-tauri/tauri.unsigned.conf.json 2>&1 | tee "$RUNNER_TEMP/tauri-build.log"
          fi

      - name: Collect release files
        id: collect
        env:
          SIGNING: ${{ steps.signing.outputs.status }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          bundle=src-tauri/target/release/bundle
          mkdir -p out
          appimage="Cubiq-Launcher_${version}_amd64.AppImage"
          deb="Cubiq-Launcher_${version}_amd64.deb"
          rpm="Cubiq-Launcher-${version}-1.x86_64.rpm"
          cp "$(ls $bundle/appimage/*.AppImage | head -1)" "out/$appimage"
          cp "$(ls $bundle/deb/*.deb | head -1)" "out/$deb"
          cp "$(ls $bundle/rpm/*.rpm | head -1)" "out/$rpm"
          # Ohne die mitgebündelten libwayland-* (sonst leeres Fenster auf Arch/Fedora),
          # danach neu signieren – die Signatur von tauri build passt nicht mehr.
          bash scripts/fix-appimage.sh "out/$appimage"
          # Der Auto-Updater kann sich unter Linux nur als AppImage selbst ersetzen – nur mit Signaturschlüssel
          # (bereinigt aus dem Schritt „Update signature“).
          if [ "$SIGNING" = "ok" ]; then
            pnpm tauri signer sign "out/$appimage" > /dev/null
            test -s "out/$appimage.sig"
            node scripts/updater-manifest.mjs platform linux-x86_64 "out/$appimage" > out/platform-linux.json
          fi
          (cd out && sha256sum "$appimage" "$deb" "$rpm" > SHA256SUMS-linux.txt)
          # AUR-Paket (cubiq-launcher-bin) mit Prüfsumme dieses Releases.
          node scripts/aur.mjs --version "$version" --deb "out/$deb" --out out/aur
          ls -la out out/aur

      - name: Status
        if: always()
        env:
          STEP_NOTES: ${{ steps.notes.outcome }}
          STEP_BUILD: ${{ steps.tauri.outcome }}
          STEP_COLLECT: ${{ steps.collect.outcome }}
          SIGNING: ${{ steps.signing.outputs.status }}
          BUILD_LOG: ${{ runner.temp }}/tauri-build.log
        run: node scripts/release-report.mjs job linux

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux
          path: out/
          if-no-files-found: warn
          # .SRCINFO (AUR) beginnt mit einem Punkt – ohne das lässt upload-artifact@v4 sie weg.
          include-hidden-files: true

  # Veröffentlichen – oder, wenn der Windows-Installer fehlt, als Entwurf mit dem Grund stehen lassen.
  publish:
    name: Publish
    needs: [prepare, build, linux]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fehlt ein Build, fehlen seine Dateien – der Bericht erklärt das.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Publish release and update channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHANGELOG: ${{ needs.prepare.outputs.changelog }}
          CHANGELOG_REASON: ${{ needs.prepare.outputs.changelog-reason }}
          SIGNING: ${{ needs.prepare.outputs.signing }}
          SIGNING_REASON: ${{ needs.prepare.outputs.signing-reason }}
          WINDOWS_RESULT: ${{ needs.build.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: node scripts/release-report.mjs finish

  # --- Android/iOS (Kanal "mobile") ---------------------------------------------------------------------------------
  # Unabhängig vom Desktop-Release: Schlägt hier etwas fehl, sind Installer und latest.json trotzdem draußen.
  # Signier-Schlüssel der APK (Secrets, siehe docs/mobile.md): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Fehlen sie, wird die APK gebaut, aber nicht veröffentlicht.
  android:
    name: Android
    needs: [prepare]
    if: needs.prepare.outputs.changelog == 'ok'
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
      # Spiel-Engine (Plugin cubiq-game, ndk-build) ist auf NDK r27d festgelegt.
      ENGINE_NDK_VERSION: 27.3.13750724
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # Ohne das veraltete Paket „tools“ (gibt es mit cmdline-tools 16 nicht mehr).
          packages: 'platform-tools'

      - name: Android NDK
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;$NDK_VERSION" "ndk;$ENGINE_NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-android
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # Ohne Changelog-Eintrag kein Release (wie Windows/Linux) – vor dem langen Build prüfen.
      - name: Release notes from CHANGELOG.md
        run: node --experimental-strip-types scripts/changelog.mjs notes "${TAG#v}" > /dev/null

      # Gradle signiert selbst (signingConfig in gen/android/app/build.gradle.kts), wenn ANDROID_KEYSTORE_PATH gesetzt ist.
      - name: Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No Android keystore secrets – the APK is built but not signed or published."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # Telefone (arm64) und Chromebooks/Emulatoren (x86_64) in einer APK – die Spiel-Engine gibt es nur für 64 Bit.
      - name: Build release APK
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CUBIQ_MSA_CLIENT_ID: ${{ vars.CUBIQ_MSA_CLIENT_ID }}
          CUBIQ_API_BASE: ${{ vars.CUBIQ_API_BASE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Nur arm64: echte Handys (x86_64 braucht nur der Emulator).
        run: pnpm tauri android build --apk --ci --target aarch64

      - name: Check signature
        id: sign
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p out
          # Ausgabe je ABI (arm64/release) oder universal – Ordner nicht fest annehmen.
          apks=$(find src-tauri/gen/android/app/build/outputs/apk -path '*release*' -name '*.apk' | sort)
          echo "$apks"
          if [ -z "${ANDROID_KEYSTORE_PATH:-}" ]; then
            cp "$(echo "$apks" | grep -- '-unsigned' | head -1)" "out/Cubiq-Launcher_${version}_unsigned.apk"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          shred -u "$ANDROID_KEYSTORE_PATH" 2> /dev/null || true
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk=$(echo "$apks" | grep -v -- '-unsigned' | head -1)
          [ -n "$apk" ] || { echo "Keine signierte APK gefunden" >&2; exit 1; }
          # Ausgabe je nach build-tools-Version unterschiedlich formatiert – die Prüfung selbst entscheidet.
          certs=$("$tools/apksigner" verify --print-certs "$apk")
          echo "$certs" | grep -E 'certificate (DN|SHA-256)' || echo "$certs"
          cp "$apk" "out/Cubiq-Launcher_${version}.apk"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/
          if-no-files-found: error

  ios:
    name: iOS
    needs: [prepare]
    if: needs.prepare.outputs.changelog == 'ok'
    runs-on: macos-latest
    env:
      # Swift-Pakete der Plugins nutzen APIs ab iOS 14; die App verlangt iOS 15.
      IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-ios
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm generate

      - name: Xcode project
        run: bash scripts/ios-project.sh

      # Unsigniert: AltStore/SideStore signieren beim Installieren mit der Apple-ID des Nutzers.
      - name: Unsigned IPA
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CUBIQ_MSA_CLIENT_ID: ${{ vars.CUBIQ_MSA_CLIENT_ID }}
          CUBIQ_API_BASE: ${{ vars.CUBIQ_API_BASE }}
        run: bash scripts/ios-unsigned-ipa.sh release "out/Cubiq-Launcher_${TAG#v}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: out/
          if-no-files-found: error

  # iOS-Spiel-Engine bauen und ins IPA packen (Artefakt „cubiq-launcher-ios“: Cubiq-Launcher.ipa + altstore-app.json).
  ios-engine:
    name: iOS engine
    needs: ios
    uses: ./.github/workflows/ios-engine.yml
    with:
      app-artifact: ios

  # Kanal "mobile": mobile.json (signiert wie client-mod.json) + AltStore-Quelle; APK/IPA zusätzlich am Versions-Release.
  # Wartet auf "publish", damit das Versions-Release schon existiert.
  mobile:
    name: Publish mobile
    needs: [prepare, publish, android, ios, ios-engine]
    # mobile.json wird mit dem Update-Schlüssel signiert – ohne gültigen Schlüssel kein Mobile-Kanal.
    if: needs.android.outputs.signed == 'true' && needs.prepare.outputs.signing == 'ok'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Nur für `tauri signer sign` (keine Nuxt-Vorbereitung nötig).
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update signature
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/check-signing.mjs --export

      - name: mobile.json and AltStore source
        run: |
          set -euo pipefail
          version="${TAG#v}"
          node --experimental-strip-types scripts/changelog.mjs notes "$version" > release-notes.md
          # IPA mit Spiel-Engine (ios-engine) statt der reinen App; Entitlements/Datenschutz für AltStore von dort.
          cp artifacts/cubiq-launcher-ios/Cubiq-Launcher.ipa "artifacts/ios/Cubiq-Launcher_${version}.ipa"
          node scripts/mobile-channel.mjs --version "$version" --notes release-notes.md --repo "$GITHUB_REPOSITORY" \
            --apk "artifacts/android/Cubiq-Launcher_${version}.apk" --ipa "artifacts/ios/Cubiq-Launcher_${version}.ipa" \
            --altstore-app artifacts/cubiq-launcher-ios/altstore-app.json --out out/mobile
          ls -la out/mobile

      - name: Publish to the mobile channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release upload "$TAG" "artifacts/android/Cubiq-Launcher_${version}.apk" "artifacts/ios/Cubiq-Launcher_${version}.ipa" --clobber
          gh release view mobile > /dev/null 2>&1 || gh release create mobile --prerelease --latest=false --title "Mobile-Kanal" \
            --notes "Wird automatisch gepflegt: mobile.json (signiert) für die Android-App und die AltStore-/SideStore-Quelle altstore.json für iOS."
          # Erst die Dateien, dann Manifest + Signatur: wer zwischendurch prüft, sieht noch den alten Stand.
          gh release upload mobile out/mobile/Cubiq-Launcher-*.apk out/mobile/Cubiq-Launcher-*.ipa --clobber
          gh release upload mobile out/mobile/altstore.json out/mobile/mobile.json.sig out/mobile/mobile.json --clobber
          # Alte APK/IPA aus dem Kanal nehmen.
          keep=" Cubiq-Launcher-${version}.apk Cubiq-Launcher-${version}.ipa altstore.json mobile.json mobile.json.sig "
          for name in $(gh release view mobile --json assets -q '.assets[].name'); do
            case "$keep" in *" $name "*) ;; *) gh release delete-asset mobile "$name" --yes ;; esac
          done
