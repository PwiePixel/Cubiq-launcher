// Cubiq Client für Forge 1.14.4 – 1.19.4 (Mojang-Namen im Code, SRG in Produktion) – eigenständiger Gradle-Build.
// EIN Quellbaum (src/), ein Unterprojekt je Minecraft-Version (:<version>), vorverarbeitet von Stonecutter.
// Versionsspezifische Werte: versions/<minecraft>/gradle.properties
pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		maven { url = 'https://maven.kikugie.dev/releases' }
		maven { url = 'https://repo.essential.gg/repository/maven-public/' }
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.minecraftforge.net/' }
	}
	resolutionStrategy {
		eachPlugin {
			if (requested.id.id == 'gg.essential.loom') {
				useModule("gg.essential:architectury-loom:${requested.version}")
			}
		}
	}
}

plugins {
	// Lädt bei Bedarf automatisch JDK 8/16/17 (Gradle-Toolchains).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'cubiqclient-forge-mojmap-legacy'

// Forge 1.14.4–1.19.4 (Mojang-Namen beim Bauen, SRG zur Laufzeit). Neue Version: hier eintragen + versions/<version>/gradle.properties.
def mojmapVersions = ['1.14.4', '1.15.2', '1.16.2', '1.16.4', '1.16.5', '1.17.1', '1.18', '1.18.1', '1.18.2',
		'1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4']
// Version, in deren Zustand src/ eingecheckt ist.
def mojmapVcsVersion = '1.16.5'
// Nur einzelne Versionen einrichten (CI: -PcubiqVersions=1.21.11,26.3); die eingecheckte Version bleibt immer dabei.
def onlyVersions = providers.gradleProperty('cubiqVersions').orNull
if (onlyVersions) {
	def wanted = onlyVersions.split(',')*.trim().findAll { it }
	def unknown = wanted - mojmapVersions
	if (unknown) throw new GradleException("cubiqVersions: unknown version(s) ${unknown}, known: ${mojmapVersions}")
	mojmapVersions = mojmapVersions.findAll { it == mojmapVcsVersion || it in wanted }
}
stonecutter {
	create(rootProject) {
		versions(*mojmapVersions)
		vcsVersion = mojmapVcsVersion
	}
}
