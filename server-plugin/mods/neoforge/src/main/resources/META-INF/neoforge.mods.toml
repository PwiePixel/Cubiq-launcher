modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPL-3.0-only"
issueTrackerURL = "https://github.com/PwiePixel/Cubiq-launcher/issues"

[[mods]]
modId = "cubiqserverrules"
version = "${version}"
displayName = "Cubiq Server Rules"
authors = "PwiePixel"
displayURL = "https://github.com/PwiePixel/Cubiq-launcher"
description = '''
Server-side only: lock or force Cubiq Client modules and settings on your server, globally or per dimension (config/cubiq-server-rules.yml, /cubiqrules). Players without the Cubiq Client are not affected.
Note: Cubiq team members with the team permission serverrules.bypass can override the rules in their own client after an in-game confirmation – documented on purpose.
'''
# Server-only mod: clients do not need it, the server's version is not compared with the client.
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.cubiqserverrules]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge},)"
ordering = "NONE"
side = "SERVER"

[[dependencies.cubiqserverrules]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft}]"
ordering = "NONE"
side = "SERVER"
